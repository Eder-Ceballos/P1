{% extends 'base.html' %}

{% block content %}
<div class="container my-4 text-center">
    <h2 class="mb-4">Gráficas Estadísticas de Películas</h2>

    <div class="card mb-4 shadow-sm p-3">
        <h3>Movies per year chart</h3>
        <img src="data:image/png;base64,{{ graphic }}" class="img-fluid" alt="Movies per year chart">
    </div>

    <div class="card mb-4 shadow-sm p-3">
        <h3>Movies per genre chart</h3>
        <img src="data:image/png;base64,{{ graphic_genre }}" class="img-fluid" alt="Movies per genre chart">
    </div>
</div>
{% endblock content %}
