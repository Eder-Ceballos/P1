{% extends 'base.html' %}

{% block content %}
<div class="container my-4">
    <h2 class="mb-4">Noticias</h2>
    
    {% for news in newss %}
        <!-- Horizontal Card de Bootstrap -->
        <div class="card mb-3">
            <div class="row g-0">
                <div class="col-md-12">
                    <div class="card-body">
                        <h5 class="card-title fw-bold">{{ news.headline }}</h5>
                        <p class="card-text">{{ news.body }}</p>
                        <p class="card-text"><small class="text-muted">{{ news.date }}</small></p>
                    </div>
                </div>
            </div>
        </div>
    {% endfor %}
</div>
{% endblock content %}
