<!DOCTYPE html>
<html>
<head>
    <title>Registrar cuentas de banco</title>
</head>
<body>

    <h1>Registrar cuenta bancaria</h1>

    <form method="POST">
        {% csrf_token %}

        <label>Tipo de cuenta:</label>

        <select name="tipo" required>
            <option value="Debito">Débito</option>
            <option value="Credito">Crédito</option>
            <option value="Efectivo">Efectivo</option>
        </select>

        <br><br>

        <label>Cuenta:</label>
        <input
        type="text"
        name="cuentaNombre"
        required
        >

        <br><br>

        <label>Saldo:</label>
        <input
            type="number"
            name="saldo"
            step="0.01"
            min="0"
            required
        >

        <br><br>

        <button type="submit">Registrar</button>

    </form>

    <br>

    <h3> <a href="/">Volver</a> </h3>

</body>
</html>
